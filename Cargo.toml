[workspace]
members = ["apps/desktop", "crates/astrolith-gpui", "crates/astrolith-core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
version = "0.1.0"
publish = false

[workspace.dependencies]
gpui-kit = "=0.8.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
debug = 1
