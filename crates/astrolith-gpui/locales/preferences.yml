      en: "IDE arguments have an unmatched closing brace."
      zh-CN: "IDE 参数中存在未匹配的右花括号。"
      ja: "IDE の引数に対応しない閉じ括弧があります。"
    url_whitespace:
      en: "The URL pattern cannot contain spaces or control characters."
      zh-CN: "URL 模式不能包含空格或控制字符。"
      ja: "URL パターンに空白や制御文字は使用できません。"
    url_slug_required:
      en: "The URL pattern must contain {slug}."
      zh-CN: "URL 模式必须包含 {slug}。"
      ja: "URL パターンには {slug} を含める必要があります。"
    url_slug_only:
      en: "Only the {slug} placeholder is supported."
      zh-CN: "仅支持 {slug} 占位符。"
      ja: "サポートされるプレースホルダーは {slug} のみです。"
    url_absolute:
      en: "Start the pattern with / or with http:// or https://."
      zh-CN: "模式需以 /、http:// 或 https:// 开头。"
      ja: "パターンは /、http://、https:// のいずれかで始めてください。"
    mapping_control_chars:
      en: "Field names cannot contain spaces or control characters."
      zh-CN: "字段名不能包含空格或控制字符。"
      ja: "フィールド名に空白や制御文字は使用できません。"
    mapping_title:
      en: "“%{value}” is not a string field for the title."
      zh-CN: "“%{value}”不是用于标题的字符串字段。"
      ja: "“%{value}”はタイトル用の文字列フィールドではありません。"
    mapping_date:
      en: "“%{value}” is not a date field for the publication date."
      zh-CN: "“%{value}”不是用于发布日期的日期字段。"
      ja: "“%{value}”は公開日付用の日付フィールドではありません。"
    mapping_description:
      en: "“%{value}” is not a string field for the description."
      zh-CN: "“%{value}”不是用于描述的字符串字段。"
      ja: "“%{value}”は説明用の文字列フィールドではありません。"
    mapping_draft:
      en: "“%{value}” is not a boolean field for the draft flag."
      zh-CN: "“%{value}”不是用于草稿标记的布尔字段。"
      ja: "“%{value}”は下書きフラグ用の真偽値フィールドではありません。"
    mapping_missing_field:
      en: "No collection schema declares a field named “%{value}”."
      zh-CN: "没有集合 schema 声明名为“%{value}”的字段。"
      ja: "“%{value}”という名前のフィールドを宣言しているコレクションスキーマはありません。"
    browser_executable_control_chars:
      en: "The browser executable cannot contain control characters."
      zh-CN: "浏览器可执行文件不能包含控制字符。"
      ja: "ブラウザーの実行ファイルに制御文字は使用できません。"
    browser_missing_executable:
      en: "Enter the browser executable before its arguments."
      zh-CN: "请先填写浏览器可执行文件，再填写参数。"
      ja: "引数の前にブラウザーの実行ファイルを入力してください。"
    browser_argument_control_chars:
      en: "Browser arguments cannot contain control characters."
      zh-CN: "浏览器参数不能包含控制字符。"
      ja: "ブラウザーの引数に制御文字は使用できません。"
    browser_unclosed_placeholder:
      en: "Browser arguments have an unclosed placeholder."
      zh-CN: "浏览器参数中存在未闭合的占位符。"
      ja: "ブラウザーの引数に閉じられていないプレースホルダーがあります。"
    browser_unknown_placeholder:
      en: "Unknown browser placeholder {%{name}}; use {url}."
      zh-CN: "未知的浏览器占位符 {%{name}}；请使用 {url}。"
      ja: "不明なブラウザーのプレースホルダー {%{name}} です。{url} を使用してください。"
    browser_stray_brace:
      en: "Browser arguments have an unmatched closing brace."
      zh-CN: "浏览器参数中存在未匹配的右花括号。"
      ja: "ブラウザーの引数に対応しない閉じ括弧があります。"
