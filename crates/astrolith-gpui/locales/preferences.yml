    relative:
      en: "Relative"
      zh-CN: "相对"
      ja: "相対"
    absolute:
      en: "Absolute"
      zh-CN: "绝对"
      ja: "絶対"
    "on":
      en: "On"
      zh-CN: "开启"
      ja: "オン"
    "off":
      en: "Off"
      zh-CN: "关闭"
      ja: "オフ"
    markdown:
      en: "Markdown (.md)"
      zh-CN: "Markdown（.md）"
      ja: "Markdown（.md）"
    mdx:
      en: "MDX (.mdx)"
      zh-CN: "MDX（.mdx）"
      ja: "MDX（.mdx）"
    external_browser:
      en: "External browser"
      zh-CN: "外部浏览器"
      ja: "外部ブラウザー"
    embedded:
      en: "Embedded WebView"
      zh-CN: "内嵌 WebView"
      ja: "埋め込み WebView"
    embedded_unavailable:
      en: "Embedded WebView (unavailable)"
      zh-CN: "内嵌 WebView（不可用）"
      ja: "埋め込み WebView（利用不可）"
    system_default:
      en: "System default"
      zh-CN: "系统默认"
      ja: "システム既定"
  placeholder:
    browser_executable:
      en: "Empty uses the system browser"
      zh-CN: "留空则使用系统浏览器"
      ja: "空欄の場合はシステムのブラウザーを使用します"
    ui_font_family:
      en: "System UI font"
      zh-CN: "系统界面字体"
      ja: "システム UI フォント"
    build_font_family:
      en: "System monospace font"
      zh-CN: "系统等宽字体"
      ja: "システム等幅フォント"
    project_content:
      en: "Inherit the Astro content directory"
      zh-CN: "继承 Astro 内容目录"
      ja: "Astro コンテンツディレクトリを継承"
    project_assets:
      en: "Inherit the configured assets directory"
      zh-CN: "继承已配置的资源目录"
      ja: "設定済みのアセットディレクトリを継承"
    project_mdx:
      en: "Inherit the MDX component directory"
      zh-CN: "继承 MDX 组件目录"
      ja: "MDX コンポーネントディレクトリを継承"
    collection_content:
      en: "Inherit the project content directory"
      zh-CN: "继承项目内容目录"
      ja: "プロジェクトのコンテンツディレクトリを継承"
    collection_assets:
      en: "Inherit the project assets directory"
      zh-CN: "继承项目资源目录"
      ja: "プロジェクトのアセットディレクトリを継承"
    collection_mapping:
      en: "Inherit the project mapping"
      zh-CN: "继承项目映射"
      ja: "プロジェクトのマッピングを継承"
  appearance:
    theme:
      en: "Colour mode"
      zh-CN: "颜色模式"
      ja: "カラーモード"
    theme_hint:
      en: "Astrolith uses one neutral light and dark palette; Follow system chooses between them from the desktop appearance."
      zh-CN: "Astrolith 使用统一的中性浅色与深色调色板；“跟随系统”会根据桌面外观在两者之间选择。"
      ja: "Astrolith は中立なライトとダークの 1 つのパレットを使用し、「システムに従う」はデスクトップの外観に応じて切り替えます。"
    theme_section:
      en: "Theme"
      zh-CN: "主题"
      ja: "テーマ"
    theme_section_hint:
      en: "Colour schemes shared by every project."
      zh-CN: "所有项目共用的配色方案。"
      ja: "すべてのプロジェクトで共有される配色。"
    interface_section:
      en: "Interface"
      zh-CN: "界面"
      ja: "インターフェース"
    interface_section_hint:
      en: "Typography for panels, controls and menus."
      zh-CN: "面板、控件和菜单的排版。"
      ja: "パネル、コントロール、メニューのタイポグラフィ。"
    interface_font:
      en: "Interface font"
      zh-CN: "界面字体"
      ja: "インターフェースフォント"
    interface_font_hint:
      en: "An installed font family. Empty uses the system UI font."
      zh-CN: "已安装的字体族。留空则使用系统界面字体。"
      ja: "インストール済みのフォントファミリー。空欄の場合はシステム UI フォントを使用します。"
    interface_size:
      en: "Interface size"
      zh-CN: "界面字号"
      ja: "インターフェースサイズ"
    interface_size_hint:
      en: "8–28 logical pixels; the default is 18."
      zh-CN: "8–28 逻辑像素；默认 18。"
      ja: "8〜28 論理ピクセル。既定値は 18。"
    panel_section:
      en: "Panel shape"
      zh-CN: "面板形状"
      ja: "パネルの形状"
    panel_section_hint:
      en: "One corner radius for panels and components across every project."
      zh-CN: "所有项目的面板和组件使用同一圆角半径。"
      ja: "すべてのプロジェクトでパネルとコンポーネントに共通の角丸半径を使用します。"
    panel_radius:
      en: "Panel and component corner radius"
      zh-CN: "面板和组件圆角半径"
      ja: "パネルとコンポーネントの角丸半径"
    panel_radius_hint:
      en: "0–24 logical pixels; applies to all panels and components. The default is 10."
      zh-CN: "0–24 逻辑像素；应用于所有面板和组件。默认 10。"
      ja: "0〜24 論理ピクセル。すべてのパネルとコンポーネントに適用されます。既定値は 10。"
    document_section:
      en: "Document"
      zh-CN: "文档"
      ja: "ドキュメント"
    document_section_hint:
      en: "Body typography, page measure and heading colours."
      zh-CN: "正文排版、页面宽度和标题颜色。"
      ja: "本文のタイポグラフィ、ページ幅、見出しの色。"
    document_font:
      en: "Document font"
      zh-CN: "文档字体"
      ja: "ドキュメントフォント"
    document_font_hint:
      en: "An installed font family. Empty uses the mock's sans face (Inter or the platform UI font)."
      zh-CN: "已安装的字体族。留空则使用预览的无衬线字体（Inter 或平台界面字体）。"
      ja: "インストール済みのフォントファミリー。空欄の場合はモックのサンセリフ書体（Inter またはプラットフォームの UI フォント）を使用します。"
    document_font_size:
      en: "Document font size"
      zh-CN: "文档字号"
      ja: "ドキュメントのフォントサイズ"
    document_font_size_hint:
      en: "1–30 logical pixels; the default is 16."
      zh-CN: "1–30 逻辑像素；默认 16。"
      ja: "1〜30 論理ピクセル。既定値は 16。"
    line_height:
      en: "Line height"
      zh-CN: "行高"
      ja: "行の高さ"
    line_height_hint:
      en: "1.2–3.0 × the font size; the default is 2.0 (16/32)."
      zh-CN: "字号的 1.2–3.0 倍；默认 2.0（16/32）。"
      ja: "フォントサイズの 1.2〜3.0 倍。既定値は 2.0（16/32）。"
    page_width:
      en: "Page width"
      zh-CN: "页面宽度"
      ja: "ページ幅"
    page_width_hint:
      en: "30–100% of the editor pane; the default is 64%."
      zh-CN: "编辑区的 30–100%；默认 64%。"
      ja: "エディターペインの 30〜100%。既定値は 64%。"
    heading_light:
      en: "Light heading colour"
      zh-CN: "浅色标题颜色"
      ja: "ライトの見出し色"
    heading_dark:
      en: "Dark heading colour"
      zh-CN: "深色标题颜色"
      ja: "ダークの見出し色"
    heading_hint:
      en: "Optional #rrggbb or #rrggbbaa. Empty keeps the palette heading colour."
      zh-CN: "可选 #rrggbb 或 #rrggbbaa。留空则使用调色板的标题颜色。"
      ja: "任意で #rrggbb または #rrggbbaa。空欄の場合はパレットの見出し色を使用します。"
    build_section:
      en: "Build"
      zh-CN: "构建"
      ja: "ビルド"
    build_section_hint:
      en: "Source editor typography."
      zh-CN: "源代码编辑器排版。"
      ja: "ソースエディターのタイポグラフィ。"
    build_font:
      en: "Build font"
      zh-CN: "构建字体"
      ja: "ビルドフォント"
    build_font_hint:
      en: "Installed family for source code. Empty uses the system monospace font."
      zh-CN: "源代码使用的已安装字体族。留空则使用系统等宽字体。"
      ja: "ソースコード用のインストール済みファミリー。空欄の場合はシステムの等幅フォントを使用します。"
    build_font_size:
      en: "Build font size"
      zh-CN: "构建字号"
      ja: "ビルドのフォントサイズ"
    build_font_size_hint:
      en: "1–30 logical pixels; default 14."
      zh-CN: "1–30 逻辑像素；默认 14。"
      ja: "1〜30 論理ピクセル。既定値は 14。"
    preview_section:
      en: "Preview"
      zh-CN: "预览"
      ja: "プレビュー"
    preview_section_hint:
      en: "Rendered document typography."
      zh-CN: "渲染后的文档排版。"
      ja: "レンダリングされたドキュメントのタイポグラフィ。"
    preview_font:
      en: "Preview font"
      zh-CN: "预览字体"
      ja: "プレビューフォント"
    preview_font_hint:
      en: "Installed family for rendered documents. Empty uses the preferred sans font."
      zh-CN: "渲染文档使用的已安装字体族。留空则使用首选无衬线字体。"
      ja: "レンダリングされたドキュメント用のインストール済みファミリー。空欄の場合は優先サンセリフフォントを使用します。"
    preview_font_size:
      en: "Preview font size"
      zh-CN: "预览字号"
      ja: "プレビューのフォントサイズ"
    preview_font_size_hint:
      en: "1–30 logical pixels; default 16."
      zh-CN: "1–30 逻辑像素；默认 16。"
      ja: "1〜30 論理ピクセル。既定値は 16。"
    browse:
      en: "Browse"
      zh-CN: "浏览"
      ja: "参照"
  workspace:
    mode_writing:
      en: "Writing"
      zh-CN: "写作"
      ja: "執筆"
    mode_build:
      en: "Build"
      zh-CN: "构建"
      ja: "ビルド"
    mode_preview:
      en: "Preview"
      zh-CN: "预览"
      ja: "プレビュー"
    startup:
      en: "Startup"
      zh-CN: "启动"
      ja: "起動"
    startup_hint:
      en: "Which workspace mode opens when there is no recorded project mode."
      zh-CN: "没有记录项目模式时打开的工作区模式。"
      ja: "プロジェクトのモードが記録されていない場合に開くワークスペースモード。"
    default_mode:
      en: "Default mode"
      zh-CN: "默认模式"
      ja: "既定のモード"
    default_mode_hint:
      en: "Used at launch when the open project has not recorded its own last mode."
      zh-CN: "打开的项目尚未记录上次模式时，在启动时使用。"
      ja: "開いているプロジェクトが最後のモードを記録していない場合、起動時に使用します。"
    layouts:
      en: "Layouts"
      zh-CN: "布局"
      ja: "レイアウト"
    layouts_hint:
      en: "Drag a dock to size it; Reset restores the design default for that mode."
      zh-CN: "拖动停靠栏可调整大小；重置会将该模式恢复为设计默认布局。"
      ja: "ドックをドラッグしてサイズを変更します。リセットするとそのモードのデザイン既定に戻ります。"
    layout_writing:
      en: "Writing layout"
      zh-CN: "写作布局"
      ja: "執筆レイアウト"
    layout_build:
      en: "Build layout"
      zh-CN: "构建布局"
      ja: "ビルドレイアウト"
    layout_preview:
      en: "Preview layout"
      zh-CN: "预览布局"
      ja: "プレビューレイアウト"
    layout_pending_hint:
      en: "Reset to the design default on Apply; Cancel keeps the current layout."
      zh-CN: "应用时恢复为设计默认布局；取消则保留当前布局。"
      ja: "適用時にデザイン既定に戻します。キャンセルすると現在のレイアウトを保持します。"
    layout_both_open:
      en: "Library and bottom tool open."
      zh-CN: "资料库和底部工具已打开。"
      ja: "ライブラリと下部ツールが開いています。"
    layout_library_open:
      en: "Library open, bottom tool closed."
      zh-CN: "资料库已打开，底部工具已关闭。"
      ja: "ライブラリが開き、下部ツールは閉じています。"
    layout_tool_open:
      en: "Library closed, bottom tool open."
      zh-CN: "资料库已关闭，底部工具已打开。"
      ja: "ライブラリは閉じ、下部ツールが開いています。"
    layout_both_closed:
      en: "Library and bottom tool closed."
      zh-CN: "资料库和底部工具已关闭。"
      ja: "ライブラリと下部ツールが閉じています。"
    project_overrides:
      en: "Project layout overrides"
      zh-CN: "项目布局覆盖"
      ja: "プロジェクトのレイアウト上書き"
    project_overrides_pending:
      en: "The project falls back to the global layouts on Apply."
      zh-CN: "应用后项目将回退到全局布局。"
      ja: "適用するとプロジェクトはグローバルレイアウトに戻ります。"
    project_overrides_set:
      en: "This project records its own dock sizes and visibility."
      zh-CN: "此项目记录了自己的停靠栏尺寸和可见性。"
      ja: "このプロジェクトは独自のドックサイズと表示状態を記録しています。"
    project_overrides_none:
      en: "This project inherits every global layout."
      zh-CN: "此项目继承了所有全局布局。"
      ja: "このプロジェクトはすべてのグローバルレイアウトを継承しています。"
    reset_pending:
      en: "Reset pending"
      zh-CN: "待重置"
      ja: "リセット待ち"
    reset_overrides:
      en: "Reset overrides"
      zh-CN: "重置覆盖"
      ja: "上書きをリセット"
    reset_project_overrides_accessibility:
      en: "Reset the project's layout overrides"
      zh-CN: "重置项目的布局覆盖"
      ja: "プロジェクトのレイアウト上書きをリセット"
    reset_layout_accessibility:
      en: "Reset the %{layout} layout"
      zh-CN: "重置%{layout}布局"
      ja: "%{layout}レイアウトをリセット"
    documents:
      en: "Documents"
      zh-CN: "文档"
      ja: "ドキュメント"
    documents_hint:
      en: "Saving behavior and defaults for new files."
      zh-CN: "保存行为和新文件默认值。"
      ja: "新しいファイルの保存動作と既定値。"
    autosave:
      en: "Idle autosave"
      zh-CN: "空闲自动保存"
      ja: "アイドル時の自動保存"
    autosave_hint:
      en: "Dirty documents save after this much idle time."
      zh-CN: "未保存的文档在此空闲时间后保存。"
      ja: "未保存のドキュメントはこのアイドル時間後に保存されます。"
    seconds:
      en: "%{seconds} seconds"
      zh-CN: "%{seconds} 秒"
      ja: "%{seconds} 秒"
    new_files:
      en: "New files"
      zh-CN: "新文件"
      ja: "新しいファイル"
    new_files_hint:
      en: "Extension used for new entries unless a project or collection overrides it."
      zh-CN: "新建条目使用的扩展名，除非项目或集合覆盖。"
      ja: "プロジェクトまたはコレクションが上書きしない限り、新規エントリーに使用する拡張子。"
    external_editor:
      en: "External editor"
      zh-CN: "外部编辑器"
      ja: "外部エディター"
    external_editor_hint:
      en: "How Astrolith opens files in another program."
      zh-CN: "Astrolith 如何在其他程序中打开文件。"
      ja: "Astrolith が別のプログラムでファイルを開く方法。"
    ide_command:
      en: "IDE command"
      zh-CN: "IDE 命令"
      ja: "IDE コマンド"
    ide_command_hint:
      en: "Launched directly as argv; no shell interprets it."
      zh-CN: "直接以 argv 启动；不经过 shell 解释。"
      ja: "argv として直接起動され、シェルは介在しません。"
    ide_arguments:
      en: "IDE arguments"
      zh-CN: "IDE 参数"
      ja: "IDE 引数"
    ide_arguments_hint:
      en: "One argument per line. {project}, {file}, {line} and {column} are substituted."
      zh-CN: "每行一个参数。会替换 {project}、{file}、{line} 和 {column}。"
      ja: "1 行に 1 つの引数。{project}、{file}、{line}、{column} が置換されます。"
  preview:
    presentation:
      en: "Presentation"
      zh-CN: "呈现方式"
      ja: "表示方法"
    presentation_hint:
      en: "Embedded WebView is available only on supported hosts; Wayland windows use the external browser."
      zh-CN: "内嵌 WebView 仅在受支持的主机上可用；Wayland 窗口使用外部浏览器。"
