  recovery:
    restoring:
      en: "Restoring %{count} unsaved document(s) from recovery…"
      zh-CN: "正在从恢复记录还原 %{count} 个未保存的文档…"
      ja: "復元レコードから未保存のドキュメント %{count} 件を復元しています…"
    none:
      en: No recovery records to restore.
      zh-CN: 没有可还原的恢复记录。
      ja: 復元できるレコードがありません。
    restored:
      en: "Restored %{restored} unsaved document(s) from recovery."
      zh-CN: "已从恢复记录还原 %{restored} 个未保存的文档。"
      ja: "復元レコードから未保存のドキュメント %{restored} 件を復元しました。"
    restored_conflicts:
      en: "Restored %{restored} unsaved document(s) from recovery. %{conflicts} changed on disk since the record; the recovery content is kept and a save will conflict until you resolve it."
      zh-CN: "已从恢复记录还原 %{restored} 个未保存的文档。%{conflicts} 个文档自记录以来在磁盘上已更改；恢复内容已保留，解决冲突前保存将会失败。"
      ja: "復元レコードから未保存のドキュメント %{restored} 件を復元しました。%{conflicts} 件はレコード以降にディスク上で変更されています。復元内容は保持されており、解決するまで保存は競合します。"
  save:
    saving:
      en: Saving…
      zh-CN: 正在保存…
      ja: 保存しています…
    closed_before_finish:
      en: Document closed before the save finished.
      zh-CN: 文档在保存完成前已关闭。
      ja: 保存が完了する前にドキュメントが閉じられました。
    saved:
      en: Saved.
      zh-CN: 已保存。
      ja: 保存しました。
    saved_earlier:
