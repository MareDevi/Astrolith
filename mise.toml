[tools]
rust = { version = "1.99.1", profile = "minimal", components = ["rust-analyzer", "rust-src", "clippy", "rustfmt"] }
node = "26.12.1"
bun = "1.4.4"

[tasks.doctor]
description = "Check the selected tools and native build prerequisites"
run = "node scripts/doctor.mjs"

[tasks.build]
description = "Build the native desktop binary"
run = "cargo build --workspace --locked"

[tasks.test]
description = "Run workspace tests without opening a native window"
run = "cargo test --workspace --locked"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Lint every workspace target"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.check]
description = "Run the current milestone's automated checks"
run = [{ task = "doctor" }, { task = "fmt" }, { task = "lint" }, { task = "build" }, { task = "test" }, { task = "test:fixtures" }]

[tasks.ci]
description = "Run the same checks in continuous integration"
run = [{ task = "check" }]

[tasks.dev]
description = "Open the native desktop window"
run = "cargo run --locked --package astrolith-desktop"

[tasks."dev:release"]
description = "Open the native desktop window with release optimizations"
run = "cargo run --release --locked --package astrolith-desktop"

[tasks."test:resize-perf"]
description = "Measure native window resize frames in the development profile"
run = "cargo test -p astrolith-gpui --locked window_resize_workload -- --ignored --nocapture"

[tasks."test:resize-perf:release"]
description = "Measure native window resize frames in release"
run = "cargo test -p astrolith-gpui --release --locked window_resize_workload -- --ignored --nocapture"

[tasks."dev:editor"]
description = "Open the disposable M00.2 Markdown editor spike"
run = "cargo run --locked --package astrolith-desktop -- --spike=editor"

[tasks."test:projection-perf"]
description = "Measure the projected writer diff and typing cost in the development profile"
run = "cargo test -p astrolith-document --locked projection_diff_workload -- --ignored --nocapture && cargo test -p astrolith-gpui --locked --lib projected_writer_workload -- --ignored --nocapture"

[tasks."test:projection-perf:release"]
description = "Measure the projected writer diff and typing cost in release"
run = "cargo test -p astrolith-document --release --locked projection_diff_workload -- --ignored --nocapture && cargo test -p astrolith-gpui --release --locked --lib projected_writer_workload -- --ignored --nocapture"

[tasks."test:editor-perf"]
description = "Measure bounded editor workloads on the headless test platform"
run = "cargo test --release --locked --package astrolith-desktop large_document_workload -- --ignored --nocapture"

[tasks."dev:layout"]
description = "Open the disposable M00.3 theme and dock spike"
run = "cargo run --locked --package astrolith-desktop -- --spike=layout"

[tasks."test:shell-perf"]
description = "Measure bounded readonly file-to-frame CPU work in the development profile"
run = "cargo test --workspace --locked readonly_file_open_workload -- --ignored --nocapture"

[tasks."test:shell-perf:release"]
description = "Measure the same readonly file-to-frame CPU workload in release"
run = "cargo test --workspace --release --locked readonly_file_open_workload -- --ignored --nocapture"

[tasks."test:editor-perf:dev"]
description = "Measure the editor workloads with the same dependency optimizations as dev"
run = "cargo test --workspace --locked large_document_workload -- --ignored --nocapture"

[tasks."test:astro"]
description = "Test static Astro discovery"
run = "cargo test -p astrolith-astro --locked"

[tasks."fmt:write"]
description = "Format workspace Rust sources"
run = "cargo fmt --all"

[tasks."lock:update"]
description = "Resolve declared Rust dependencies into the committed lockfile"
run = "cargo metadata --format-version 1"

[tasks."test:document"]
description = "Test retained document buffers"
run = "cargo test -p astrolith-document --locked"

[tasks."test:gpui"]
description = "Test native workspace interactions headlessly"
run = "cargo test -p astrolith-gpui --locked"

[tasks."test:fixtures"]
description = "Verify frozen Astro fixtures with the actual project-local loaders"
run = "node --test fixtures/test-astro-fixtures.test.mjs && node scripts/test-astro-fixtures.mjs"

[tasks."test:workspace"]
description = "Test collection index and bounded watcher"
run = "cargo test -p astrolith-workspace --locked"
