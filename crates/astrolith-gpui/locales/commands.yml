      no_preferences_dir:
        en: "Unavailable: no preferences directory"
        zh-CN: "不可用：没有偏好设置目录"
        ja: "利用できません: 設定ディレクトリがありません"
      privacy_notice:
        en: "Astrolith has no telemetry and no analytics endpoint. The only Astrolith network request is the signed update manifest, and only when this build was compiled with a manifest URL and public key. These paths hold local data; this dialog lists them without opening or reading any file."
        zh-CN: "Astrolith 没有遥测，也没有分析端点。Astrolith 唯一的网络请求是签名的更新清单，并且仅当此构建在编译时带有清单 URL 和公钥时才会发出。这些路径存放本地数据；此对话框只列出它们，不会打开或读取任何文件。"
        ja: "Astrolith にはテレメトリーも分析エンドポイントもありません。Astrolith が行うネットワークリクエストは署名付きの更新マニフェストのみで、しかもこのビルドがマニフェスト URL と公開鍵付きでコンパイルされている場合に限られます。これらのパスにはローカルデータが保存されていますが、このダイアログはファイルを開いたり読んだりせずに一覧表示するだけです。"
      delete_warning:
        en: "Quit Astrolith before deleting these directories. The user privacy page documents what each one contains and how to remove it; Preferences → Advanced → Reset All removes only preferences and the registry."
        zh-CN: "删除这些目录之前请先退出 Astrolith。用户隐私页面说明了每个目录包含的内容以及如何删除；偏好设置 → 高级 → 全部重置只会删除偏好设置和注册表。"
        ja: "これらのディレクトリを削除する前に Astrolith を終了してください。各ディレクトリの内容と削除方法はユーザープライバシーページに記載されています。設定 → 詳細設定 → すべてリセットでは、設定とレジストリのみが削除されます。"
