[package]
name = "astrolith-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Compiles the real embedded WebView surface. Linux hosts it on X11/XWayland.
embedded-webview = ["dep:gpui-webview", "dep:wry"]

[dependencies]
tracing.workspace = true
astrolith-workspace = { path = "../astrolith-workspace" }
astrolith-core = { path = "../astrolith-core" }
astrolith-astro = { path = "../astrolith-astro" }
astrolith-document = { path = "../astrolith-document" }
astrolith-preview = { path = "../astrolith-preview" }
astrolith-terminal = { path = "../astrolith-terminal" }
astrolith-observability = { path = "../astrolith-observability" }
gpui-kit = { workspace = true, features = [
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-astro",
    "tree-sitter-yaml",
] }
gpui-webview = { version = "=0.8.1", optional = true }
wry = { version = "=0.53.3", package = "lb-wry", optional = true }
tokio.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
chrono.workspace = true
image.workspace = true
ureq.workspace = true
ring.workspace = true
base64.workspace = true
tempfile = "3.27.0"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
