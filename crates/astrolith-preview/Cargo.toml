[package]
name = "astrolith-preview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Compiles the optional embedded WebView surface (M06.2). Detection reports
# Embedded only when this feature is on and the host can host it.
embedded-webview = []

[dependencies]
tracing.workspace = true
astrolith-astro = { path = "../astrolith-astro" }
astrolith-core = { path = "../astrolith-core" }
tokio.workspace = true
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29.0", features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"

# The workspace forbids `unsafe_code`. Windows process ownership uses the raw
# Job Object APIs from `windows-sys`, which are `unsafe` extern functions, so this
# crate holds the same lint at `deny` and the single Windows module opts back in
# with a scoped `#[allow(unsafe_code)]`. Every other crate keeps the workspace
# `forbid`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
