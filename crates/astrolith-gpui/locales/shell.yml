    changes:
      en: Changes
      zh-CN: 更改
      ja: 変更
    working_tree_clean:
      en: Working tree clean
      zh-CN: 工作区干净
      ja: 作業ツリーはクリーンです
    branches:
      en: Branches
      zh-CN: 分支
      ja: ブランチ
    diff_staged:
      en: "%{path} · staged"
      zh-CN: "%{path} · 已暂存"
      ja: "%{path} · ステージ済み"
    diff_working:
      en: "%{path} · working tree"
      zh-CN: "%{path} · 工作区"
      ja: "%{path} · 作業ツリー"
    no_diff:
      en: No diff
      zh-CN: 无差异
      ja: 差分なし
    refresh:
      en: Refresh
      zh-CN: 刷新
      ja: 更新
    refresh_accessibility:
      en: Refresh Git status
      zh-CN: 刷新 Git 状态
      ja: Git 状態を更新
  inspector:
    title:
      en: Frontmatter
      zh-CN: 前置元数据
      ja: フロントマター
    entry_details:
      en: Entry details
      zh-CN: 条目详情
      ja: エントリの詳細
    entry_details_collection:
      en: "Entry details · %{collection}"
      zh-CN: "条目详情 · %{collection}"
      ja: "エントリの詳細 · %{collection}"
  palette:
    title:
      en: Command palette
      zh-CN: 命令面板
      ja: コマンドパレット
    search:
      en: Search commands…
      zh-CN: 搜索命令…
      ja: コマンドを検索…
    empty:
      en: No matching commands
      zh-CN: 没有匹配的命令
      ja: 一致するコマンドはありません
    group:
      recent:
        en: Recent projects
        zh-CN: 最近的项目
        ja: 最近のプロジェクト
      collections:
        en: Collections
        zh-CN: 内容库
        ja: コレクション
  finder:
    title:
      en: Content Finder
      zh-CN: 内容查找器
      ja: コンテンツファインダー
    search:
      en: Search entries by title or ID…
      zh-CN: 按标题或 ID 搜索条目…
      ja: タイトルまたは ID でエントリを検索…
    empty:
      en: No matching entries
      zh-CN: 没有匹配的条目
      ja: 一致するエントリはありません
