      zh-CN: 已保存较早的修订版；较新的编辑仍未保存。
      ja: 以前のリビジョンを保存しました。新しい編集は未保存のままです。
    conflict:
      en: "Save conflict: the file changed on disk. Your edits are kept. Choose “Reload from Disk (discard my edits)”, “Overwrite Disk with My Edits”, or “Save My Edits as a Copy” to resolve it."
      zh-CN: "保存冲突：文件已在磁盘上更改。你的编辑已保留。请选择“从磁盘重新加载（放弃我的编辑）”、“用我的编辑覆盖磁盘”或“将我的编辑另存为副本”来解决。"
      ja: "保存の競合：ファイルがディスク上で変更されました。編集内容は保持されています。「ディスクから再読み込み（自分の編集を破棄）」「自分の編集でディスクを上書き」「編集をコピーとして保存」のいずれかで解決してください。"
    failed:
