[package]
name = "astrolith-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Opt-in embedded WebView build; Linux hosts it through X11/XWayland.
embedded-webview = ["astrolith-gpui/embedded-webview"]

[dependencies]
astrolith-gpui = { path = "../../crates/astrolith-gpui" }
astrolith-observability = { path = "../../crates/astrolith-observability" }
gpui-kit.workspace = true
tracing.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
