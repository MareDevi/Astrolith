_version: 2
update:
  capability:
    not_configured:
      en: "Update checks are not configured in this build, so checking for updates is unavailable."
      zh-CN: "此版本未配置更新检查，因此无法检查更新。"
      ja: "このビルドではアップデート確認が設定されていないため、アップデートを確認できません。"
    insecure_manifest_url:
      en: "This build has an insecure update manifest URL, so checking for updates is unavailable."
      zh-CN: "此版本配置的更新清单 URL 不是 HTTPS，因此无法检查更新。"
      ja: "このビルドのアップデートマニフェスト URL が HTTPS ではないため、アップデートを確認できません。"
    invalid_public_key:
      en: "This build has an invalid update public key, so checking for updates is unavailable."
      zh-CN: "此版本配置的更新公钥无效，因此无法检查更新。"
      ja: "このビルドのアップデート公開鍵が無効なため、アップデートを確認できません。"
  status:
    idle:
      en: "Updates have not been checked yet."
      zh-CN: "尚未检查更新。"
      ja: "アップデートはまだ確認されていません。"
    checking:
      en: "Checking for updates…"
      zh-CN: "正在检查更新…"
      ja: "アップデートを確認しています…"
    up_to_date:
      en: "Astrolith %{version} is the latest version."
      zh-CN: "Astrolith %{version} 已是最新版本。"
      ja: "Astrolith %{version} は最新バージョンです。"
    available:
      en: "Astrolith %{version} is available. This build is %{current}."
      zh-CN: "Astrolith %{version} 已发布，当前版本为 %{current}。"
      ja: "Astrolith %{version} が利用可能です。このビルドは %{current} です。"
    skipped:
      en: "Astrolith %{version} is available, but you chose to skip this version."
      zh-CN: "Astrolith %{version} 已发布，但你选择跳过此版本。"
      ja: "Astrolith %{version} が利用可能ですが、このバージョンはスキップされています。"
    failed:
      en: "Could not check for updates. %{reason}"
      zh-CN: "无法检查更新。%{reason}"
      ja: "アップデートを確認できませんでした。%{reason}"
  error:
    network:
      en: "The update server could not be reached: %{reason}"
      zh-CN: "无法连接到更新服务器：%{reason}"
      ja: "アップデートサーバーに接続できませんでした: %{reason}"
    http_status:
      en: "The update server answered with status %{status}."
      zh-CN: "更新服务器返回状态 %{status}。"
      ja: "アップデートサーバーがステータス %{status} を返しました。"
    too_large:
      en: "The update manifest is larger than %{bytes} bytes."
      zh-CN: "更新清单大于 %{bytes} 字节。"
      ja: "アップデートマニフェストが %{bytes} バイトを超えています。"
    malformed:
      en: "The update manifest is malformed: %{reason}"
      zh-CN: "更新清单格式错误：%{reason}"
      ja: "アップデートマニフェストの形式が正しくありません: %{reason}"
    invalid_encoding:
      en: "The update manifest contains invalid base64 data: %{reason}"
      zh-CN: "更新清单包含无效的 base64 数据：%{reason}"
      ja: "アップデートマニフェストに無効な base64 データが含まれています: %{reason}"
    signature:
      en: "The update manifest signature is not valid."
      zh-CN: "更新清单签名无效。"
      ja: "アップデートマニフェストの署名が有効ではありません。"
    insecure_manifest_url:
      en: "The update manifest URL is not HTTPS."
      zh-CN: "更新清单 URL 不是 HTTPS。"
      ja: "アップデートマニフェストの URL が HTTPS ではありません。"
    insecure_release_page_url:
      en: "The update release page URL is not HTTPS."
      zh-CN: "更新的发布页面 URL 不是 HTTPS。"
      ja: "アップデートのリリースページ URL が HTTPS ではありません。"
    insecure_artifact_url:
      en: "The update download URL is not HTTPS."
      zh-CN: "更新下载 URL 不是 HTTPS。"
      ja: "アップデートのダウンロード URL が HTTPS ではありません。"
    unsupported_version:
      en: "The update manifest declares an unsupported version: %{version}"
      zh-CN: "更新清单声明的版本不受支持：%{version}"
      ja: "アップデートマニフェストがサポートされていないバージョンを宣言しています: %{version}"
    no_artifact:
      en: "The update manifest has no download for this platform."
      zh-CN: "更新清单中没有适用于此平台的下载。"
      ja: "アップデートマニフェストにこのプラットフォーム向けのダウンロードがありません。"
    invalid_digest:
      en: "The update manifest declares an invalid artifact digest."
      zh-CN: "更新清单声明的构件摘要无效。"
      ja: "アップデートマニフェストが無効な成果物ダイジェストを宣言しています。"
services:
  drop:
    nothing:
      en: "Nothing was dropped."
      zh-CN: "没有拖入任何内容。"
      ja: "何もドロップされませんでした。"
    exactly_one:
      en: "Drop exactly one project folder or one Markdown/MDX file."
      zh-CN: "请仅拖入一个项目文件夹或一个 Markdown/MDX 文件。"
      ja: "プロジェクトフォルダー 1 つ、または Markdown/MDX ファイル 1 つだけをドロップしてください。"
    unsupported_entry:
      en: "Only Markdown (.md) and MDX (.mdx) files can be opened by dropping."
      zh-CN: "只能通过拖放打开 Markdown（.md）和 MDX（.mdx）文件。"
      ja: "ドロップで開けるのは Markdown (.md) と MDX (.mdx) ファイルだけです。"
    project_required:
      en: "Open the project first, then drop one of its Markdown or MDX files."
      zh-CN: "请先打开项目，然后再拖入该项目的 Markdown 或 MDX 文件。"
      ja: "先にプロジェクトを開いてから、その Markdown または MDX ファイルをドロップしてください。"
    outside_project:
      en: "%{path} is outside the open project."
      zh-CN: "%{path} 不在当前打开的项目内。"
      ja: "%{path} は開いているプロジェクトの外にあります。"
  link:
    invalid_link:
      en: "Invalid Astrolith link: %{error}"
      zh-CN: "Astrolith 链接无效：%{error}"
      ja: "Astrolith リンクが無効です: %{error}"
    unsupported_scheme:
      en: "Only %{expected}:// links are supported, not %{scheme}://."
      zh-CN: "仅支持 %{expected}:// 链接，不支持 %{scheme}://。"
      ja: "%{expected}:// リンクのみサポートしています。%{scheme}:// は使用できません。"
    missing_open_host:
      en: "An Astrolith link must use the `open` host."
      zh-CN: "Astrolith 链接必须使用 `open` 主机。"
      ja: "Astrolith リンクは `open` ホストを使用する必要があります。"
    missing_path:
      en: "The Astrolith link has no `path` parameter."
      zh-CN: "Astrolith 链接缺少 `path` 参数。"
      ja: "Astrolith リンクに `path` パラメーターがありません。"
    relative_path:
      en: "The Astrolith link path must be absolute."
      zh-CN: "Astrolith 链接的路径必须是绝对路径。"
      ja: "Astrolith リンクのパスは絶対パスである必要があります。"
    not_content_entry:
      en: "%{path} is not a Markdown or MDX entry."
      zh-CN: "%{path} 不是 Markdown 或 MDX 条目。"
      ja: "%{path} は Markdown または MDX のエントリーではありません。"
    missing_target:
      en: "%{path} does not exist."
      zh-CN: "%{path} 不存在。"
      ja: "%{path} は存在しません。"
    unregistered_project:
      en: "%{path} is not inside a project Astrolith has opened. Open the project once, then try again."
      zh-CN: "%{path} 不在 Astrolith 已打开的项目内。请先打开该项目，然后再试一次。"
      ja: "%{path} は Astrolith で開いたことのあるプロジェクトの内側にありません。一度プロジェクトを開いてから再試行してください。"
    non_utf8_argument:
      en: "A launch argument is not valid UTF-8 and was ignored."
      zh-CN: "某个启动参数不是有效的 UTF-8，已被忽略。"
      ja: "起動引数に有効な UTF-8 でないものがあり、無視されました。"
  file:
    regular_file_only:
      en: "Choose a regular file."
      zh-CN: "请选择一个普通文件。"
      ja: "通常のファイルを選択してください。"
    too_large:
      en: "Readonly files are limited to 8 MiB."
      zh-CN: "只读文件上限为 8 MiB。"
      ja: "読み取り専用ファイルは 8 MiB までです。"
    not_utf8:
      en: "Choose a UTF-8 text file."
      zh-CN: "请选择一个 UTF-8 文本文件。"
      ja: "UTF-8 のテキストファイルを選択してください。"
    too_many_lines:
      en: "Readonly files are limited to 50,000 lines."
      zh-CN: "只读文件上限为 50,000 行。"
      ja: "読み取り専用ファイルは 50,000 行までです。"
  ide:
    not_configured:
      en: "No IDE is configured in Preferences."
      zh-CN: "偏好设置中尚未配置 IDE。"
      ja: "設定で IDE が構成されていません。"
    control_executable:
      en: "The configured IDE command contains control characters."
      zh-CN: "配置的 IDE 命令包含控制字符。"
      ja: "構成された IDE コマンドに制御文字が含まれています。"
    control_argument:
      en: "The configured IDE argument contains control characters."
      zh-CN: "配置的 IDE 参数包含控制字符。"
      ja: "構成された IDE 引数に制御文字が含まれています。"
    file_outside_project:
      en: "The file is outside the project and was not sent to the IDE."
      zh-CN: "该文件不在项目内，未发送到 IDE。"
      ja: "ファイルはプロジェクトの外にあるため、IDE に送信されませんでした。"
    markdown_only:
      en: "Only Markdown and MDX entries can be opened in the IDE."
      zh-CN: "只有 Markdown 和 MDX 条目才能在 IDE 中打开。"
      ja: "IDE で開けるのは Markdown と MDX のエントリーだけです。"
    file_placeholder_missing:
      en: "The IDE command uses the %{placeholder} placeholder, but this action has no file selected."
      zh-CN: "IDE 命令使用了 %{placeholder} 占位符，但此操作没有选中文件。"
      ja: "IDE コマンドは %{placeholder} プレースホルダーを使用していますが、この操作ではファイルが選択されていません。"
    absolute_only:
      en: "Only absolute project paths can be sent to the IDE."
      zh-CN: "只能将绝对项目路径发送到 IDE。"
      ja: "IDE に送信できるのは絶対プロジェクトパスだけです。"
    parent_directory:
      en: "The IDE path contains a parent-directory segment."
      zh-CN: "IDE 路径包含上级目录片段。"
      ja: "IDE パスに親ディレクトリのセグメントが含まれています。"
    control_path:
      en: "The IDE path contains control characters."
      zh-CN: "IDE 路径包含控制字符。"
      ja: "IDE パスに制御文字が含まれています。"
    spawn_failed:
      en: "Could not start the IDE (`%{executable}`): %{error}"
      zh-CN: "无法启动 IDE（`%{executable}`）：%{error}"
      ja: "IDE を起動できませんでした (`%{executable}`): %{error}"
