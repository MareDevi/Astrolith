      zh-CN: 打开 Astro 项目
      ja: Astro プロジェクトを開く
  warning:
    unknown_collection:
      en: "The content directory override names unknown collection “%{name}”; it was ignored."
      zh-CN: "内容目录覆盖指定了未知集合“%{name}”；已忽略。"
      ja: "コンテンツディレクトリの上書きが不明なコレクション「%{name}」を指定しています。無視されました。"
