      en: "GENERAL"
      zh-CN: "通用"
      ja: "一般"
    project:
      en: "PROJECT"
      zh-CN: "项目"
      ja: "プロジェクト"
    advanced:
      en: "ADVANCED"
      zh-CN: "高级"
      ja: "詳細"
  sheet:
    reset:
      en: "Reset"
      zh-CN: "重置"
      ja: "リセット"
    user_guide:
      en: "User guide"
      zh-CN: "用户指南"
      ja: "ユーザーガイド"
    keyboard_shortcuts:
      en: "Keyboard shortcuts"
      zh-CN: "键盘快捷键"
      ja: "キーボードショートカット"
    cancel:
      en: "Cancel"
      zh-CN: "取消"
      ja: "キャンセル"
    apply:
      en: "Apply"
      zh-CN: "应用"
      ja: "適用"
    fix_errors:
      en: "Fix the highlighted values before applying."
      zh-CN: "请先修正高亮显示的值再应用。"
      ja: "適用する前にハイライトされた値を修正してください。"
    apply_note:
      en: "Changes apply immediately and persist atomically."
      zh-CN: "更改会立即生效并以原子方式保存。"
      ja: "変更はすぐに反映され、アトミックに保存されます。"
  pane:
    appearance:
      label:
        en: "Appearance"
        zh-CN: "外观"
        ja: "外観"
      description:
        en: "Theme, interface type and document typography."
        zh-CN: "主题、界面字体与文档排版。"
        ja: "テーマ、インターフェースの書体、ドキュメントのタイポグラフィ。"
    workspace:
      label:
        en: "Workspace"
        zh-CN: "工作区"
        ja: "ワークスペース"
      description:
        en: "Startup behavior, panel layouts, saving and file defaults."
        zh-CN: "启动行为、面板布局、保存与新文件默认值。"
        ja: "起動時の動作、パネルレイアウト、保存とファイルの既定値。"
    preview:
      label:
        en: "Preview"
        zh-CN: "预览"
        ja: "プレビュー"
      description:
        en: "How the live site opens and which browser to use."
        zh-CN: "实时站点如何打开以及使用哪个浏览器。"
        ja: "ライブサイトの開き方と使用するブラウザー。"
    project:
      label:
        en: "Project Settings"
        zh-CN: "项目设置"
        ja: "プロジェクト設定"
      description:
        en: "Defaults for this project's content workflow."
        zh-CN: "此项目内容工作流的默认值。"
        ja: "このプロジェクトのコンテンツワークフローの既定値。"
    collections:
      label:
        en: "Collections"
        zh-CN: "集合"
        ja: "コレクション"
      description:
        en: "Directories, field mappings and style per collection."
        zh-CN: "每个集合的目录、字段映射和样式。"
        ja: "コレクションごとのディレクトリ、フィールドマッピング、スタイル。"
    advanced:
      label:
        en: "Advanced"
        zh-CN: "高级"
        ja: "詳細設定"
      description:
        en: "Paths, integrations and reset actions."
        zh-CN: "路径、集成和重置操作。"
        ja: "パス、連携、リセット操作。"
