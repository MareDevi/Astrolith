[workspace]
members = [
    "apps/desktop",
    "crates/astrolith-gpui",
    "crates/astrolith-core",
    "crates/astrolith-astro",
    "crates/astrolith-document",
    "crates/astrolith-workspace",
    "crates/astrolith-preview",
    "crates/astrolith-observability",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
version = "0.1.0"
publish = false

[workspace.dependencies]
gpui-kit = "=0.8.1"
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "sync", "time", "net", "process", "io-util"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json", "registry", "tracing-log"] }
tracing-appender = "=0.2.5"
trash = "=5.2.9"
chrono = "=0.4.45"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
ureq = "=3.5.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
debug = 1

# Keep application code easy to debug while the editor's hot paths stay usable.
# These overrides also apply to tests, so dev benchmarks exercise the same code.
[profile.dev.package]
gpui-base = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
ropey = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
tree-sitter = { opt-level = 3 }
taffy = { opt-level = 3 }
