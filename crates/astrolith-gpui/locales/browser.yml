      zh-CN: 重命名
      ja: 名前を変更
    trash_title:
      en: "Move “%{title}” to the Trash?"
      zh-CN: "将“%{title}”移到废纸篓？"
      ja: "「%{title}」をゴミ箱に移動しますか？"
    trash_dirty_body:
      en: The document has unsaved changes. Save them first, or discard them and move the file to the Trash.
      zh-CN: 此文档有未保存的更改。请先保存，或放弃更改并将文件移到废纸篓。
      ja: このドキュメントには保存されていない変更があります。先に保存するか、変更を破棄してファイルをゴミ箱に移動してください。
    discard_and_trash:
