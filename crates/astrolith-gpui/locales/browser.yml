      zh-CN: 保存并移到废纸篓
      ja: 保存してゴミ箱へ
    trash_body:
      en: The file moves to the desktop Trash; it is never permanently deleted here.
      zh-CN: 文件将移到桌面废纸篓；在此处绝不会被永久删除。
      ja: ファイルはデスクトップのゴミ箱に移動します。ここで完全に削除されることはありません。
