      en: "%{file} was not moved to the Trash because newer edits were typed while saving. Save again, then trash it."
      zh-CN: "%{file} 未移到废纸篓，因为保存期间输入了更新的编辑。请再次保存，然后再移到废纸篓。"
      ja: "保存中に新しい編集が入力されたため、%{file} はゴミ箱に移動されませんでした。もう一度保存してからゴミ箱に移動してください。"
    close_aborted_newer:
      en: "%{file} was not closed because newer edits were typed while saving. Save again, then close it."
      zh-CN: "%{file} 未关闭，因为保存期间输入了更新的编辑。请再次保存，然后再关闭。"
      ja: "保存中に新しい編集が入力されたため、%{file} は閉じられませんでした。もう一度保存してから閉じてください。"
    duplicate_aborted_newer:
      en: "%{file} was not duplicated because newer edits were typed while saving. Save again, then duplicate it."
      zh-CN: "%{file} 未复制，因为保存期间输入了更新的编辑。请再次保存，然后再复制。"
      ja: "保存中に新しい編集が入力されたため、%{file} は複製されませんでした。もう一度保存してから複製してください。"
  project_error:
    unreadable:
      en: "Could not open %{path}: %{error}"
      zh-CN: "无法打开 %{path}：%{error}"
      ja: "%{path} を開けませんでした：%{error}"
    not_a_directory:
      en: "Choose a project directory, not %{path}."
      zh-CN: "请选择项目目录，而不是 %{path}。"
      ja: "プロジェクトディレクトリを選択してください（%{path} ではありません）。"
  blocked_root:
    filesystem_root:
      en: "The filesystem root cannot be opened as a project. Choose the project folder instead."
      zh-CN: "无法将文件系统根目录作为项目打开。请改为选择项目文件夹。"
      ja: "ファイルシステムのルートはプロジェクトとして開けません。プロジェクトのフォルダを選択してください。"
    home_directory:
      en: "The home directory cannot be opened as a project. Choose the project folder instead."
      zh-CN: "无法将主目录作为项目打开。请改为选择项目文件夹。"
      ja: "ホームディレクトリはプロジェクトとして開けません。プロジェクトのフォルダを選択してください。"
    system_directory:
      en: "System directories such as /usr and /etc cannot be opened as projects."
      zh-CN: "诸如 /usr 和 /etc 的系统目录不能作为项目打开。"
      ja: "/usr や /etc などのシステムディレクトリはプロジェクトとして開けません。"
    credential_directory:
      en: "Credential directories such as ~/.ssh and ~/.aws cannot be opened as projects."
      zh-CN: "诸如 ~/.ssh 和 ~/.aws 的凭据目录不能作为项目打开。"
      ja: "~/.ssh や ~/.aws などの認証情報ディレクトリはプロジェクトとして開けません。"
