_version: 2
browser:
  explorer:
    title:
      en: Explorer
      zh-CN: 资源管理器
      ja: エクスプローラー
    refresh:
      en: Refresh files
      zh-CN: 刷新文件
      ja: ファイルを更新
    error_title:
      en: Could not read project files
      zh-CN: 无法读取项目文件
      ja: プロジェクトのファイルを読み込めませんでした
    empty_title:
      en: No project files
      zh-CN: 没有项目文件
      ja: プロジェクトファイルがありません
    empty_body:
      en: This project contains no readable files.
      zh-CN: 此项目不包含可读取的文件。
      ja: このプロジェクトには読み取り可能なファイルがありません。
    truncated:
      en: Some project files are hidden by the scan limit.
      zh-CN: 部分项目文件因扫描上限而隐藏。
      ja: 一部のプロジェクトファイルはスキャン上限により非表示になっています。
  recent:
    open:
      en: "Open %{name}"
      zh-CN: "打开 %{name}"
      ja: "%{name} を開く"
    open_in_parent:
      en: "Open %{name} (%{parent})"
      zh-CN: "打开 %{name}（%{parent}）"
      ja: "%{name}（%{parent}）を開く"
  library:
    title:
      en: Library
      zh-CN: 资料库
      ja: ライブラリ
    all_collections:
      en: All collections
      zh-CN: 所有集合
      ja: すべてのコレクション
    up_one_folder:
      en: Up one folder
      zh-CN: 返回上一级
      ja: 一つ上のフォルダーへ
    open_project:
      en: Open project…
      zh-CN: 打开项目…
      ja: プロジェクトを開く…
    actions:
      en: Library actions
      zh-CN: 资料库操作
      ja: ライブラリの操作
    copy_relative_path:
      en: Copy relative path
      zh-CN: 复制相对路径
      ja: 相対パスをコピー
    copy_absolute_path:
      en: Copy absolute path
      zh-CN: 复制绝对路径
      ja: 絶対パスをコピー
    show_drafts_only:
      en: Show drafts only
      zh-CN: 仅显示草稿
      ja: 下書きのみ表示
    reverse_sort_direction:
      en: Reverse sort direction
      zh-CN: 反转排序方向
      ja: 並び順を反転
    clear_filter:
      en: Clear filter
      zh-CN: 清除筛选
      ja: フィルターをクリア
    new_entry:
      en: New entry
      zh-CN: 新建条目
      ja: 新規エントリ
    no_collections_title:
      en: No collections
      zh-CN: 没有集合
      ja: コレクションがありません
    no_collections_body:
      en: This project declares no content collections.
      zh-CN: 此项目未声明任何内容集合。
      ja: このプロジェクトにはコンテンツコレクションが宣言されていません。
    index_unavailable:
      en: Project index unavailable
      zh-CN: 项目索引不可用
      ja: プロジェクトインデックスを利用できません
    retry:
      en: Retry
      zh-CN: 重试
      ja: 再試行
    filtered_empty_title:
      en: No entries match the filter
      zh-CN: 没有条目符合筛选条件
      ja: フィルターに一致するエントリがありません
    filtered_empty_body:
      en: Change the search text or clear the draft filter.
      zh-CN: 请更改搜索文本或清除草稿筛选。
      ja: 検索テキストを変更するか、下書きフィルターを解除してください。
    empty_title:
      en: No entries
      zh-CN: 没有条目
      ja: エントリがありません
    empty_body:
      en: This collection contains no Markdown or MDX files.
      zh-CN: 此集合不包含 Markdown 或 MDX 文件。
      ja: このコレクションには Markdown または MDX ファイルがありません。
    search_placeholder:
      en: Filter by file or title
      zh-CN: 按文件或标题筛选
      ja: ファイルまたはタイトルで絞り込む
    scanning:
      en: Scanning collections…
      zh-CN: 正在扫描集合…
      ja: コレクションをスキャンしています…
    loading_body:
      en: The project index is loading.
      zh-CN: 项目索引正在加载。
      ja: プロジェクトインデックスを読み込み中です。
    open_error_title:
      en: Could not open project
      zh-CN: 无法打开项目
      ja: プロジェクトを開けませんでした
    choose_another_project:
      en: Choose another project…
      zh-CN: 选择其他项目…
      ja: 別のプロジェクトを選択…
    no_project_title:
      en: No project open
      zh-CN: 未打开项目
      ja: プロジェクトが開かれていません
    no_project_body:
      en: Open an Astro project to browse its content collections.
      zh-CN: 打开一个 Astro 项目以浏览其内容集合。
      ja: Astro プロジェクトを開いてコンテンツコレクションを閲覧します。
    draft_badge:
      en: Draft
      zh-CN: 草稿
      ja: 下書き
  filter:
    drafts_only:
      en: Drafts only
      zh-CN: 仅草稿
      ja: 下書きのみ
    drafts_query:
      en: "Drafts · “%{query}”"
      zh-CN: "草稿 · “%{query}”"
      ja: "下書き · “%{query}”"
    query:
      en: "“%{query}”"
      zh-CN: "“%{query}”"
      ja: "“%{query}”"
  sort:
    default:
      en: Default
      zh-CN: 默认
      ja: 既定
    title:
      en: Title
      zh-CN: 标题
      ja: タイトル
    filename:
      en: Filename
      zh-CN: 文件名
      ja: ファイル名
    last_modified:
      en: Last modified
      zh-CN: 上次修改时间
      ja: 最終更新日時
    date_field:
      en: "Date · %{field}"
      zh-CN: "日期 · %{field}"
      ja: "日付 · %{field}"
    order:
      en: Order
      zh-CN: 顺序
      ja: 並び順
  count:
    entry:
      en: "%{count} entry"
      zh-CN: "%{count} 个条目"
      ja: "%{count} 件のエントリ"
    entries:
      en: "%{count} entries"
      zh-CN: "%{count} 个条目"
      ja: "%{count} 件のエントリ"
    collections:
      en: "%{count} collections"
      zh-CN: "%{count} 个集合"
      ja: "%{count} 件のコレクション"
    visible_of_total:
      en: "%{visible} of %{total} entries"
      zh-CN: "共 %{total} 个条目，显示 %{visible} 个"
      ja: "%{total} 件中 %{visible} 件を表示"
  status:
    data_collection_unavailable:
      en: "Data collection unavailable: %{diagnostic}"
      zh-CN: "数据集合不可用：%{diagnostic}"
      ja: "データコレクションを利用できません：%{diagnostic}"
    entry_not_indexed:
      en: That entry is no longer in the project index.
      zh-CN: 该条目已不在项目索引中。
      ja: そのエントリはプロジェクトインデックスに存在しません。
    open_document_for_link:
      en: Open a document before inserting a link.
      zh-CN: 请在插入链接前打开文档。
      ja: リンクを挿入する前にドキュメントを開いてください。
    link_inserted:
      en: "Inserted a link to %{title}."
      zh-CN: "已插入指向 %{title} 的链接。"
      ja: "%{title} へのリンクを挿入しました。"
    link_not_inserted:
      en: The link could not be inserted at the current selection.
      zh-CN: 无法在当前选区插入链接。
      ja: 現在の選択範囲にリンクを挿入できませんでした。
    open_document_for_drop:
      en: Open a Markdown or MDX document before dropping files.
      zh-CN: 请先打开 Markdown 或 MDX 文档再拖放文件。
      ja: ファイルをドロップする前に Markdown または MDX ドキュメントを開いてください。
    drop_requires_markdown:
      en: Files can only be dropped on a Markdown or MDX document.
      zh-CN: 只能将文件拖放到 Markdown 或 MDX 文档。
      ja: ファイルは Markdown または MDX ドキュメントにのみドロップできます。
    assets_dir_unavailable:
      en: "Assets directory unavailable: %{error}"
      zh-CN: "资源目录不可用：%{error}"
      ja: "アセットディレクトリを利用できません：%{error}"
    assets_not_copied:
      en: "Assets were not copied: %{error}"
      zh-CN: "未复制资源：%{error}"
      ja: "アセットをコピーできませんでした：%{error}"
    assets_markdown_not_inserted:
      en: The asset files were copied but their Markdown could not be inserted.
      zh-CN: 资源文件已复制，但其 Markdown 无法插入。
      ja: アセットファイルはコピーされましたが、その Markdown を挿入できませんでした。
    frontmatter_edit_failed:
      en: "Could not edit frontmatter: %{error}"
      zh-CN: "无法编辑前置元数据：%{error}"
      ja: "フロントマターを編集できませんでした：%{error}"
    invalid_raw_yaml:
      en: "invalid raw YAML: %{error}"
      zh-CN: "无效的原始 YAML：%{error}"
      ja: "無効な生 YAML: %{error}"
    project_directory_select_failed:
      en: Could not select a project directory.
      zh-CN: 无法选择项目目录。
      ja: プロジェクトディレクトリを選択できませんでした。
    checking_project_folder:
      en: Checking the project folder…
      zh-CN: 正在检查项目文件夹…
      ja: プロジェクトフォルダーを確認しています…
    project_open_failed:
      en: "Could not open project: %{error}"
      zh-CN: "无法打开项目：%{error}"
      ja: "プロジェクトを開けませんでした：%{error}"
    open_project_before_reload:
      en: Open a project before reloading collections.
      zh-CN: 请先打开项目再重新加载集合。
      ja: コレクションを再読み込みする前にプロジェクトを開いてください。
    reloading_collections:
      en: Reloading collections…
      zh-CN: 正在重新加载集合…
      ja: コレクションを再読み込みしています…
    collections_reload_failed:
      en: "Could not reload collections: %{error}"
      zh-CN: "无法重新加载集合：%{error}"
      ja: "コレクションを再読み込みできませんでした：%{error}"
    collections_reloaded:
      en: "Collections reloaded · %{count} entries."
      zh-CN: "集合已重新加载 · %{count} 个条目。"
      ja: "コレクションを再読み込みしました · %{count} 件のエントリ。"
    collection_no_entries_show:
      en: "Collection “%{name}” has no entries to show."
      zh-CN: "集合“%{name}”没有可显示的条目。"
      ja: "コレクション「%{name}」に表示できるエントリがありません。"
    collection_no_entries:
      en: "Collection “%{name}” has no entries yet."
      zh-CN: "集合“%{name}”尚无条目。"
      ja: "コレクション「%{name}」にはまだエントリがありません。"
    collection_entries:
      en: "Collection “%{name}” · %{count} entries."
      zh-CN: "集合“%{name}” · %{count} 个条目。"
      ja: "コレクション「%{name}」 · %{count} 件のエントリ。"
    open_project_before_browse:
      en: Open a project before browsing its files.
      zh-CN: 请先打开项目再浏览其文件。
      ja: ファイルを閲覧する前にプロジェクトを開いてください。
    file_open_failed:
      en: "Could not open %{path}: %{error}"
      zh-CN: "无法打开 %{path}：%{error}"
      ja: "%{path} を開けませんでした：%{error}"
    read_failed:
      en: "Could not read %{path}: %{error}"
      zh-CN: "无法读取 %{path}：%{error}"
      ja: "%{path} を読み込めませんでした：%{error}"
    path_outside_project:
      en: "%{path} is outside the open project."
      zh-CN: "%{path} 位于当前项目之外。"
      ja: "%{path} は開いているプロジェクトの外にあります。"
    ide_unavailable:
      en: "%{command} is unavailable until an IDE is configured and a project is open."
      zh-CN: "在配置 IDE 并打开项目之前，%{command} 不可用。"
      ja: "IDE が設定され、プロジェクトが開かれるまで %{command} は使用できません。"
    ide_opened:
      en: Opened in the IDE.
      zh-CN: 已在 IDE 中打开。
      ja: IDE で開きました。
    ide_open_failed:
      en: "Could not open the IDE: %{error}"
      zh-CN: "无法打开 IDE：%{error}"
      ja: "IDE を開けませんでした：%{error}"
    switch_cancelled_conflict:
      en: "Project switch cancelled: a document changed on disk and was not overwritten. Resolve the conflict (reload, overwrite, or save a copy), then switch."
      zh-CN: "已取消切换项目：某个文档在磁盘上已更改且未被覆盖。请先解决冲突（重新加载、覆盖或另存副本），然后切换。"
      ja: "プロジェクトの切り替えを中止しました：ドキュメントがディスク上で変更されており、上書きされませんでした。競合を解決（再読み込み、上書き、またはコピーとして保存）してから切り替えてください。"
    switch_cancelled_save_failed:
      en: "Project switch cancelled: the document could not be saved (%{error})."
      zh-CN: "已取消切换项目：文档无法保存（%{error}）。"
      ja: "プロジェクトの切り替えを中止しました：ドキュメントを保存できませんでした（%{error}）。"
    quit_cancelled_conflict:
      en: "Quit cancelled: a document changed on disk and was not overwritten. Resolve the conflict (reload, overwrite, or save a copy), then quit."
      zh-CN: "已取消退出：某个文档在磁盘上已更改且未被覆盖。请先解决冲突（重新加载、覆盖或另存副本），然后退出。"
      ja: "終了を中止しました：ドキュメントがディスク上で変更されており、上書きされませんでした。競合を解決（再読み込み、上書き、またはコピーとして保存）してから終了してください。"
    quit_cancelled_save_failed:
      en: "Quit cancelled: a document could not be saved (%{error})."
      zh-CN: "已取消退出：文档无法保存（%{error}）。"
      ja: "終了を中止しました：ドキュメントを保存できませんでした（%{error}）。"
    generation_exhausted:
      en: Project generation exhausted; restart the application.
      zh-CN: 项目代次已耗尽；请重新启动应用。
      ja: プロジェクトの世代が上限に達しました。アプリケーションを再起動してください。
    discovering_project:
      en: Discovering project…
      zh-CN: 正在发现项目…
      ja: プロジェクトを検出しています…
    formatting_unfocused:
      en: Formatting is unavailable while this document is not focused.
      zh-CN: 文档未获得焦点时无法使用格式化。
      ja: ドキュメントにフォーカスがないため書式設定を利用できません。
    line_outside_document:
      en: "Line %{line} is outside this document."
      zh-CN: "第 %{line} 行超出此文档范围。"
      ja: "%{line} 行目はこのドキュメントの範囲外です。"
    open_document_for_goto:
      en: Open a document before going to a line.
      zh-CN: 请先打开文档再跳转到行。
      ja: 行に移動する前にドキュメントを開いてください。
    enter_line_number:
      en: Enter a line number to go to.
      zh-CN: 请输入要跳转的行号。
      ja: 移動先の行番号を入力してください。
    written_not_indexed:
      en: "%{source} was written but is not indexed by its collection pattern."
      zh-CN: "%{source} 已写入，但未被其集合模式索引。"
      ja: "%{source} は書き込まれましたが、コレクションのパターンでインデックスされていません。"
    project_diagnostics:
      en: "Project diagnostics: %{diagnostics}"
      zh-CN: "项目诊断：%{diagnostics}"
      ja: "プロジェクトの診断：%{diagnostics}"
    index_refreshed:
      en: Index refreshed; open buffers retained. Close and reopen an unchanged document to reload it.
      zh-CN: 索引已刷新；打开的缓冲区已保留。关闭并重新打开未更改的文档以重新加载。
      ja: インデックスを更新しました。開いているバッファは保持されています。未変更のドキュメントを再読み込みするには、閉じてから開き直してください。
    index_unavailable_buffers:
      en: Project index unavailable. Open buffers retained.
      zh-CN: 项目索引不可用。打开的缓冲区已保留。
      ja: プロジェクトインデックスを利用できません。開いているバッファは保持されています。
    checking_repository:
      en: Checking repository…
      zh-CN: 正在检查仓库…
      ja: リポジトリを確認しています…
    open_project_before_copy_assets:
      en: Open a project before copying assets.
      zh-CN: 请先打开项目再复制资源。
      ja: アセットをコピーする前にプロジェクトを開いてください。
    open_mdx_for_components:
      en: Open an MDX document before inserting components.
      zh-CN: 请先打开 MDX 文档再插入组件。
      ja: コンポーネントを挿入する前に MDX ドキュメントを開いてください。
    active_document_not_editable:
      en: The active document is not editable.
      zh-CN: 当前文档不可编辑。
      ja: アクティブなドキュメントは編集できません。
    components_only_mdx:
      en: Components can only be inserted into MDX documents.
      zh-CN: 只能将组件插入 MDX 文档。
      ja: コンポーネントは MDX ドキュメントにのみ挿入できます。
    open_project_for_components:
      en: Open a project before inserting components.
      zh-CN: 请先打开项目再插入组件。
      ja: コンポーネントを挿入する前にプロジェクトを開いてください。
    active_document_outside_project:
      en: The active document is outside the project.
      zh-CN: 当前文档位于项目之外。
      ja: アクティブなドキュメントはプロジェクトの外にあります。
    component_inserted_with_import:
      en: "Inserted %{component}. Its import was added; undo removes only the component."
      zh-CN: "已插入 %{component}。已添加其导入；撤销只会移除该组件。"
      ja: "%{component} を挿入しました。インポートを追加しました。元に戻すとコンポーネントのみが削除されます。"
    component_inserted:
      en: "Inserted %{component}."
      zh-CN: "已插入 %{component}。"
      ja: "%{component} を挿入しました。"
    file_manager_unsupported:
      en: Opening a file manager is unsupported on this platform.
      zh-CN: 此平台不支持打开文件管理器。
      ja: このプラットフォームではファイルマネージャーを開けません。
    file_manager_exited:
      en: "The file manager exited with %{status}."
      zh-CN: "文件管理器以 %{status} 退出。"
      ja: "ファイルマネージャーが %{status} で終了しました。"
  load:
    open_project_before_source:
      en: Open the project before opening a source file.
      zh-CN: 请先打开项目再打开源文件。
      ja: ソースファイルを開く前にプロジェクトを開いてください。
    not_editable_source:
      en: "%{path} is not an editable project source file."
      zh-CN: "%{path} 不是可编辑的项目源文件。"
      ja: "%{path} は編集可能なプロジェクトソースファイルではありません。"
    two_documents_loading:
      en: Two documents are loading; try again when one finishes.
      zh-CN: 两个文档正在加载；请等待其中一个完成后重试。
      ja: 2 つのドキュメントを読み込み中です。いずれかが完了してから再試行してください。
    document_limit:
      en: Close an open document before opening more than 32 documents.
      zh-CN: 请先关闭一个已打开的文档，再打开超过 32 个文档。
      ja: 32 個を超えてドキュメントを開く前に、開いているドキュメントを閉じてください。
    source_budget:
      en: Close documents before exceeding the 32 MiB loaded-source budget.
      zh-CN: 请先关闭文档，以免超出 32 MiB 的已加载源预算。
      ja: 読み込み済みソースの上限 32 MiB を超える前に、ドキュメントを閉じてください。
    project_not_ready:
      en: The project is not ready; try again after it opens.
      zh-CN: 项目尚未就绪；请在打开后重试。
      ja: プロジェクトの準備ができていません。開いた後に再試行してください。
    source_mapping_changed_reopen:
      en: Source mapping changed; reopen the project.
      zh-CN: 源映射已更改；请重新打开项目。
      ja: ソースマッピングが変更されました。プロジェクトを開き直してください。
    source_mapping_changed_rescan:
      en: Source mapping changed; rescan the project.
      zh-CN: 源映射已更改；请重新扫描项目。
      ja: ソースマッピングが変更されました。プロジェクトを再スキャンしてください。
    line_limit:
      en: Documents are limited to 50,000 lines.
      zh-CN: 文档限制为 50,000 行。
      ja: ドキュメントは 50,000 行までです。
    loading_document:
      en: Loading document…
      zh-CN: 正在加载文档…
      ja: ドキュメントを読み込んでいます…
    refreshing_index:
      en: Refreshing the project index; select this entry again when it finishes.
      zh-CN: 正在刷新项目索引；完成后请再次选择此条目。
      ja: プロジェクトインデックスを更新しています。完了後にこのエントリをもう一度選択してください。
    two_documents_loading_entry:
      en: Two documents are loading; select this entry again when one finishes.
      zh-CN: 两个文档正在加载；请等待其中一个完成后再选择此条目。
